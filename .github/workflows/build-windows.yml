name: build-windows

on:
 push:
  branches: [ master ]
 workflow_dispatch:

jobs:
 build:
  runs-on: windows-latest
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Set up Python 3.12
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'
  - name: Install dependencies
    run: |
     python -m pip install --upgrade pip
     pip install -r app/requirements.txt
     pip install "onnxruntime-gpu[cuda,cudnn]==1.24.4" pyinstaller==6.22.3
  - name: Download FFmpeg
    shell: pwsh
    run: |
     Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
     Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
     $ffmpeg = Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
     "FFMPEG_DIR=$($ffmpeg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
  - name: Build
    run: pyinstaller app/FaceSwap.spec --noconfirm
  - name: Self test
    shell: pwsh
    run: |
     $process = Start-Process -FilePath dist/FaceSwap/FaceSwap.exe -ArgumentList '--self-test', "$PWD/self-test.txt" -Wait -PassThru
     Get-Content self-test.txt
     if ($process.ExitCode -ne 0) { exit 1 }
  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
     name: FaceSwap-windows-${{ github.sha }}
     path: dist/FaceSwap
     retention-days: 14
